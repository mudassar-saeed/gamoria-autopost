name: Refresh Instagram token

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 08:17 Pakistan time
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Renew token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          pip install requests
          python scripts/refresh_ig_token.py "$RUNNER_TEMP/ig_token"
          echo "::add-mask::$(cat "$RUNNER_TEMP/ig_token")"

      - name: Save new token to the IG_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT secret is missing, so the new token can't be saved. See README."
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
          rm -f "$RUNNER_TEMP/ig_token"
          echo "IG_ACCESS_TOKEN updated."
